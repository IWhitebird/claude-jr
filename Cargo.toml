[package]
name = "claude-jr"
version = "0.1.2"
edition = "2024"
description = "claude-jr (Claude Junior): a small, fast coding agent for the terminal, in one Rust binary. A lightweight Claude Code alternative."
license = "MIT"
repository = "https://github.com/IWhitebird/claude-jr"
homepage = "https://iwhitebird.github.io/claude-jr/"
readme = "README.md"
keywords = ["claude", "coding-agent", "ai", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]

# The command is claudejr; the project is claude-jr.
[[bin]]
name = "claudejr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
signal-hook = "0.3"
unicode-width = "0.2.3"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
