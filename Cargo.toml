[package]
name = "claude-jr"
version = "0.2.0"
edition = "2024"
description = "claude-jr (Claude Junior): a small, fast coding agent for the terminal, in one Rust binary. A lightweight Claude Code alternative."
license = "MIT"
repository = "https://github.com/IWhitebird/claude-jr"
homepage = "https://claudejr.iwhitebird.com"
readme = "README.md"
keywords = ["claude", "coding-agent", "ai", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]
# What a published crate carries: enough to build the binary.
include = ["/src/**", "/assets/mascot.txt", "/README.md", "/LICENSE"]

# `cargo binstall` downloads the release's binary instead of compiling:
# claudejr-linux-x86_64, claudejr-macos-aarch64, claudejr-windows-x86_64.exe, ...
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/claudejr-{ os-name }-{ target-arch }{ binary-ext }"
pkg-fmt = "bin"

# The command is claudejr; the project is claude-jr.
[[bin]]
name = "claudejr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
# Already in the binary through the TLS library; used to sign requests to Bedrock.
ring = "0.17"
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste", "windows"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
signal-hook = "0.3"
unicode-width = "0.2.3"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# On Linux, input is read with poll() rather than crossterm's default
# (edge-triggered epoll), which can leave text that arrives in one burst of
# over 1 KB unread until the next key press. macOS's poll() can't wait on a
# terminal, so it keeps the default.
[target.'cfg(target_os = "linux")'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste", "use-dev-tty"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
