name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      # The real UI in a real terminal (tmux): after any resize the screen must
      # be exactly what a fresh run at that size shows.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python3 bench/resize.py target/release/claudejr
      # Random keys, pastes and resizes: it must stay up and never send a malformed request.
      - run: python3 bench/chaos.py target/release/claudejr 4 250
  # The release build (build.sh) on each kind of machine releases are made on.
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: ./build.sh ${{ matrix.target }}
      - run: ./target/${{ matrix.target }}/release/claudejr --version
