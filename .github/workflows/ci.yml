name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      # The real UI in a real terminal (tmux): after any resize the screen must
      # be exactly what a fresh run at that size shows.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python3 bench/resize.py target/release/claudejr
      # Random keys, pastes and resizes: it must stay up and never send a malformed request.
      - run: python3 bench/chaos.py target/release/claudejr 4 250
  # The release build (build.sh) on each kind of machine releases are made on.
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: ./build.sh ${{ matrix.target }}
      - run: ./target/${{ matrix.target }}/release/claudejr --version
      # The Docker image, built from this binary and run against the fake API.
      - if: runner.os == 'Linux'
        run: bench/docker.sh target/${{ matrix.target }}/release/claudejr
      # The unit tests on macOS too (the end-to-end ones need Linux tools).
      - if: runner.os != 'Linux'
        run: cargo test --release --bin claudejr
      # On Windows the real binary is put through its paces against the fake
      # API: tools in Git Bash and in PowerShell, sessions, background tasks.
      - if: runner.os == 'Windows'
        run: bash bench/windows.sh target/${{ matrix.target }}/release/claudejr.exe
  # The other ways in, each used the way a user would: Homebrew (this checkout
  # is the tap) and cargo binstall. Both download a released binary.
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: brew install
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap iwhitebird/claude-jr "$GITHUB_WORKSPACE"
          brew install iwhitebird/claude-jr/claude-jr
          brew test iwhitebird/claude-jr/claude-jr
          claudejr --version
      - uses: cargo-bins/cargo-binstall@main
      # Between a version bump and its release there is nothing to download yet.
      - name: cargo binstall
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if ! curl -fsIL --retry 3 -o /dev/null "https://github.com/IWhitebird/claude-jr/releases/download/v$version/version"; then
            echo "no release of $version yet"; exit 0
          fi
          cargo binstall --manifest-path . --strategies crate-meta-data --no-confirm --disable-telemetry \
            --root "$RUNNER_TEMP/binstall" claude-jr
          test "$("$RUNNER_TEMP/binstall/bin/claudejr" --version)" = "claude-jr $version"
