<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 16 160 144" width="200" height="180" shape-rendering="crispEdges" role="img" aria-label="claude-jr"><title>claude-jr</title><style>
@media (prefers-reduced-motion: no-preference) {
  .bob { animation: bob 1.3s steps(2, jump-none) infinite alternate; }
  .wing { transform-box: view-box; transform-origin: 100px 35px; animation: spin .45s steps(3, jump-none) infinite alternate; }
  .eye { transform-box: fill-box; transform-origin: 50% 75%; animation: blink 5s infinite; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  @keyframes spin { from { transform: scaleX(1); } to { transform: scaleX(.3); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
}
